<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Venkateshwara Silver</title><meta name="description" content="Demo checkout form for silver jewellery orders with customer details, address, payment option and confirmation."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238f1d2c'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='28' fill='white' font-family='serif'%3EVS%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="assets/css/style.css" rel="stylesheet"><link href="assets/css/responsive.css" rel="stylesheet"></head><body data-page="checkout"><div id="siteHeader"></div><main><section class="inner-hero"><div class="container"><span>Checkout</span><h1>Place Demo Order</h1><p>No payment gateway is connected. This creates a showroom enquiry confirmation.</p></div></section><section class="section-pad"><div class="container"><form id="checkoutForm" class="checkout-layout needs-validation" novalidate><div class="checkout-card"><h2>Customer Details</h2><div class="row g-3"><div class="col-md-6"><input class="form-control" name="name" placeholder="Name" required></div><div class="col-md-6"><input class="form-control" name="mobile" placeholder="Mobile" required></div><div class="col-md-6"><input class="form-control" name="whatsapp" placeholder="WhatsApp" required></div><div class="col-md-6"><input type="email" class="form-control" name="email" placeholder="Email" required></div><div class="col-12"><textarea class="form-control" name="address" placeholder="Address" required></textarea></div><div class="col-md-6"><input class="form-control" name="city" placeholder="City" required></div><div class="col-md-6"><input class="form-control" name="district" placeholder="District" required></div><div class="col-md-6"><input class="form-control" name="state" placeholder="State" required></div><div class="col-md-6"><input class="form-control" name="pincode" placeholder="Pincode" required></div><div class="col-12"><select class="form-select" name="payment" required><option value="">Payment Option</option><option>Cash on Delivery</option><option>UPI</option><option>Bank Transfer</option><option>Card</option></select></div><div class="col-12"><button class="btn btn-luxury" type="submit">Confirm Demo Order</button></div></div><div id="orderConfirmation" class="order-confirmation"></div></div><aside id="checkoutSummary" class="summary-card"></aside></form></div></section></main><div id="siteFooter"></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/products.js"></script><script src="assets/js/cart.js"></script><script src="assets/js/main.js"></script></body></html>
