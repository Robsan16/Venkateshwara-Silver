<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Premium Silver Jewellery | Venkateshwara Silver</title>
  <meta name="description" content="Browse premium silver rings, chains, anklets, bangles, earrings, gifts, coins and pooja articles with transparent demo pricing.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238f1d2c'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='28' fill='white' font-family='serif'%3EVS%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"><link href="assets/css/style.css" rel="stylesheet"><link href="assets/css/responsive.css" rel="stylesheet">
</head>
<body data-page="shop">
  <div id="siteHeader"></div>
  <main>
    <section class="inner-hero"><div class="container"><span>Shop</span><h1>Premium Silver Jewellery</h1><p>Transparent silver value, purity, weight and making charge details for confident buying.</p></div></section>
    <section class="section-pad">
      <div class="container">
        <div class="shop-layout">
          <aside class="filters-panel">
            <div class="filter-title"><h2>Filters</h2><button class="btn-reset" id="resetFilters">Reset</button></div>
            <label>Search<input id="shopSearch" class="form-control" type="search" placeholder="Search product or SKU"></label>
            <label>Category<select id="categoryFilter" class="form-select"><option value="">All Categories</option></select></label>
            <label>Purity<select id="purityFilter" class="form-select"><option value="">All Purity</option><option value="999">999</option><option value="925">925</option><option value="900">900</option></select></label>
            <label>Price<select id="priceFilter" class="form-select"><option value="">All Price</option><option value="0-2000">Below ₹2,000</option><option value="2000-5000">₹2,000 - ₹5,000</option><option value="5000-10000">₹5,000 - ₹10,000</option><option value="10000-25000">₹10,000 - ₹25,000</option><option value="25000-999999">Above ₹25,000</option></select></label>
            <label>Weight<select id="weightFilter" class="form-select"><option value="">All Weight</option><option value="0-10">Below 10g</option><option value="10-25">10-25g</option><option value="25-50">25-50g</option><option value="50-100">50-100g</option><option value="100-500">100-500g</option><option value="500-1000">500g+</option><option value="1000-99999">1kg+</option></select></label>
            <label>Sort<select id="sortFilter" class="form-select"><option value="latest">Latest</option><option value="price-low">Price Low to High</option><option value="price-high">Price High to Low</option><option value="popular">Popular</option><option value="best">Best Selling</option></select></label>
          </aside>
          <div class="shop-results">
            <div class="result-bar"><strong id="resultCount"></strong><span>Demo silver rates - final prices may vary with daily rate.</span></div>
            <div id="shopProducts" class="product-grid"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="quickViewMount"></div><div id="siteFooter"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script><script src="assets/js/products.js"></script><script src="assets/js/cart.js"></script><script src="assets/js/main.js"></script>
</body>
</html>
